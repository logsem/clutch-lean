name = "metrology"
testDriver = "ProbLangTest"
defaultTargets = ["Metrology", "ProbLangSampleWidget"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "v4.35.0"

[[require]]
name = "iris"
git = "https://github.com/leanprover-community/iris-lean.git"
rev = "v4.35.0"
subDir = "Iris"

# SampCert dropped in the iris-lean-bump branch: it has no v4.30.0 release.
# The two dependent files Metrology/SampCert/{SLang,Samplers}.lean are excluded
# from the build (orphan modules, not imported by the default target).
# [[require]]
# name = "sampcert"
# git = "https://github.com/leanprover/SampCert.git"
# rev = "v4.29.0"

[[lean_lib]]
name = "Metrology"

[[lean_exe]]
name = "metrology"
root = "Main"

[[lean_exe]]
name = "ProbLangTest"
root = "ProbLangTest"

[[lean_exe]]
name = "bench"
root = "BigStepBench"

# Draws the samples for `#sample`.
[[lean_exe]]
name = "problang-sample"
root = "ProbLangSample"

# The `#sample` widget, which runs `problang-sample`: building the widget builds it first.
[[lean_lib]]
name = "ProbLangSampleWidget"
needs = ["problang-sample"]
