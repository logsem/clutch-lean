name = "metrology"
testDriver = "ProbLangTest"
defaultTargets = ["Metrology", "ProbLangSampleWidget", "MetrologyAsm",
  "Tests.SailSpike", "Tests.StrictBinders", "Tests.Keypair"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "v4.35.0"

[[require]]
name = "iris"
git = "https://github.com/leanprover-community/iris-lean.git"
rev = "v4.35.0"
subDir = "Iris"

# SampCert dropped in the iris-lean-bump branch: it has no v4.30.0 release.
# The two dependent files Metrology/SampCert/{SLang,Samplers}.lean are excluded
# from the build (orphan modules, not imported by the default target).
# [[require]]
# name = "sampcert"
# git = "https://github.com/leanprover/SampCert.git"
# rev = "v4.29.0"

[[lean_lib]]
name = "Metrology"

[[lean_exe]]
name = "metrology"
root = "Main"

[[lean_exe]]
name = "ProbLangTest"
root = "ProbLangTest"

[[lean_exe]]
name = "bench"
root = "BigStepBench"

# Draws the samples for `#sample`.
[[lean_exe]]
name = "problang-sample"
root = "ProbLangSample"

# The `#sample` widget, which runs `problang-sample`: building the widget builds it first.
[[lean_lib]]
name = "ProbLangSampleWidget"
needs = ["problang-sample"]

# Pinned Sail runtime and architecture for the assembly FFI examples.
[[require]]
name = "Sail"
path = "runtime/lean-sail"

[[lean_lib]]
name = "RiscvZkvm.Sail"
moreLeanArgs = ["--tstack=400000"]
moreLeancArgs = ["-fbracket-depth=500"]

# Only this diagnostic module needs Lean's legacy do elaborator.
[[lean_lib]]
name = "RiscvZkvm.Sail.RvfiDii"
moreLeanArgs = ["--tstack=400000"]
leanOptions.backward.do.legacy = true

[[lean_lib]]
name = "MetrologyAsm"
moreLeanArgs = ["--tstack=400000"]

[[lean_lib]]
name = "Tests.SailSpike"
moreLeanArgs = ["--tstack=400000"]

[[lean_lib]]
name = "Tests.StrictBinders"
moreLeanArgs = ["--tstack=400000"]

[[lean_lib]]
name = "Tests.StrictSourceEquivalence"
moreLeanArgs = ["--tstack=400000"]

[[lean_lib]]
name = "Tests.Keypair"
moreLeanArgs = ["--tstack=400000"]
